# develop, not master: a release fast-forwards master onto a commit develop
# has already uploaded, and Codecov files each commit under one branch only,
# so master never gets a new head. At release time the two are the same commit.
codecov:
  branch: develop

fixes:
  - "github.com/SafirSDK/minilog-web-viewer/::src/web-viewer/"

flags:
  server:
    paths:
      - src/server/
      - src/send/
    carryforward: true
  web-viewer:
    paths:
      - src/web-viewer/
    carryforward: true

component_management:
  individual_components:
    - component_id: server
      name: C++ Server
      flag_regexes:
        - server
    - component_id: web-viewer
      name: Go Web Viewer
      flag_regexes:
        - web-viewer
