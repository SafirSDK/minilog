# develop, not master: a release fast-forwards master onto a commit develop
# has already uploaded, and Codecov files each commit under one branch only,
# so master never gets a new head. At release time the two are the same commit.
codecov:
  branch: develop

fixes:
  - "github.com/SafirSDK/minilog-web-viewer/::src/web-viewer/"

flags:
  server:
    paths:
      - src/server/
      - src/send/
    carryforward: true
  # The same paths as `server`, uploaded by the Windows coverage job. Codecov
  # merges two reports of one file as the union of their hits, which is what is
  # wanted here: a line is covered if either platform's tests reach it, and the
  # files that exist on only one platform — service_win.cpp, service_windows.go
  # and the rest — are reported by the only job that can compile them.
  server-windows:
    paths:
      - src/server/
      - src/send/
    carryforward: true
  web-viewer:
    paths:
      - src/web-viewer/
    carryforward: true
  web-viewer-windows:
    paths:
      - src/web-viewer/
    carryforward: true
  web-ui:
    paths:
      - src/web-viewer/assets/
    carryforward: true

component_management:
  individual_components:
    - component_id: server
      name: C++ Server
      flag_regexes:
        - server
        - server-windows
    - component_id: web-viewer
      name: Go Web Viewer
      flag_regexes:
        - web-viewer
        - web-viewer-windows
    - component_id: web-ui
      name: Web UI (JavaScript)
      flag_regexes:
        - web-ui
