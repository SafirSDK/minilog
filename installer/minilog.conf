[server]
host    = 0.0.0.0
udp_port = 514
workers  = 4
max_queue_bytes = 16MB

[output.main]
text_file        = C:\ProgramData\minilog\logs\syslog.log
jsonl_file       = C:\ProgramData\minilog\logs\syslog.jsonl
max_size         = 100MB
max_files        = 10
facility         = *
include_malformed = true

; Where minilog-web-viewer listens. An empty host means every interface. The
; Start Menu and desktop shortcuts were built from this port at install time and
; cannot follow a later edit, so update them by hand if you change it.
[web_viewer]
host             =
port             = 9514

[forwarding]
enabled          = false
host             = 127.0.0.1
port             = 514
facility         = *
max_message_size = 0
