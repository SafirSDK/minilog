; minilog configuration, read by both the minilog and minilog-web-viewer
; services. Restart them to apply a change.
;
; A comment starts a line with ';'. A value runs to the end of its line, so text
; after a value is part of it, and a misspelled key or value is a startup error.
; The README's Configuration section describes every option in full:
; https://github.com/SafirSDK/minilog#configuration

[server]
; IP address the UDP socket binds to. 0.0.0.0 is every IPv4 interface;
; 127.0.0.1 accepts senders on this machine only.
host    = 0.0.0.0
; UDP port to listen on. 514 is the standard syslog port.
udp_port = 514
; I/O worker threads, 1 to 256.
workers  = 4
; Received-but-unwritten log held in memory before further datagrams are
; dropped. Units B, KB, MB, GB; a plain number is bytes.
max_queue_bytes = 16MB

; One [output.<name>] section per log destination. Add more to route by
; facility. Paths must be absolute, and minilog creates no directories.
[output.main]
; Raw datagrams, one per line, with control characters escaped.
text_file        = C:\ProgramData\minilog\logs\syslog.log
; Parsed records, one JSON object per line. This is what the web viewer reads.
jsonl_file       = C:\ProgramData\minilog\logs\syslog.jsonl
; Rotate both files when either exceeds this size. 0 disables rotation.
max_size         = 100MB
; Rotated generations to keep (syslog.1.log, syslog.2.log, ...), 0 to 1000.
; 0 keeps them all.
max_files        = 10
; Comma-separated facility names to write here, or * for all.
facility         = *
; Facility names to leave out of what facility accepts. With facility = * this
; is "everything except these". Absent or empty excludes nothing.
;exclude_facility = local3
; Also write datagrams that parse as neither RFC 3164 nor RFC 5424. Set to
; false to discard them; true, false, 1 and 0 are the accepted spellings.
include_malformed = true

; Where minilog-web-viewer listens. An empty host means every interface. The
; Start Menu and desktop shortcuts were built from this port at install time and
; cannot follow a later edit, so update them by hand if you change it.
[web_viewer]
; Address to bind the HTTP listener to. Empty is every interface, IPv4 and
; IPv6; 127.0.0.1 keeps the viewer local. There is no authentication.
host             =
; TCP port to listen on.
port             = 9514

; Forward received datagrams to another syslog receiver over UDP.
[forwarding]
; Set to true to turn forwarding on; true, false, 1 and 0 are accepted.
enabled          = false
; Destination host name or IP address. The port goes in the next key; a
; "host:port" value is a config error.
host             = 127.0.0.1
; Destination UDP port.
port             = 514
; Facilities to forward. Same syntax as in [output.*].
facility         = *
; Facilities not to forward, taken out of what facility accepts.
;exclude_facility = local3
; Truncate forwarded messages longer than this many bytes. 0 means no limit.
max_message_size = 0
