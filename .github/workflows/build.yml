name: Build & Test

# Third-party actions are pinned to a full commit SHA with the version in a
# trailing comment. A tag is a mutable pointer, so "@v2" means the code that
# runs here can change without any change in this file — and these jobs hold
# GITHUB_TOKEN (the release upload) and CODECOV_TOKEN (the coverage upload).
# actions/* are GitHub's own and are left on tags.
#
# To move one: read the new SHA with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'
# and dereference it with git/tags/<sha> if that returns an annotated tag
# object rather than a commit.

on:
  push:
    branches: [ master, develop, feature/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # ─── clang-format check ─────────────────────────────────────────────────────
  clang-format:
    name: clang-format check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      # Pinned, and from PyPI rather than apt, because the version decides what
      # the gate accepts: `apt-get install clang-format` follows whatever the
      # runner image ships, and when ubuntu-latest moved from 24.04 to 26.04 it
      # went from 18 to 21 and failed two files that no commit had touched. The
      # PyPI package is LLVM's own binary and installs on any distribution, so
      # a contributor on an older Ubuntu can match this exactly:
      #     pip install clang-format==21.1.6
      # Moving to a newer clang-format is then this line plus whatever it
      # reformats, in one commit of its own.
      - name: Install clang-format
        run: pip install clang-format==21.1.6

      - name: Check formatting
        run: |
          find src/server src/send tests/server tests/send -name "*.cpp" -o -name "*.hpp" \
            | xargs clang-format --dry-run --Werror

  # ─── File header check ───────────────────────────────────────────────────────
  check-headers:
    name: File header check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - run: python3 tests/check_headers.py

  # ─── Python linting (ruff) ──────────────────────────────────────────────────
  ruff:
    name: Ruff (Python linting)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check .

  # ─── Go formatting (gofmt) ──────────────────────────────────────────────────
  gofmt:
    name: gofmt check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      # The C++ side has had a clang-format gate from the start and the Go side
      # had nothing, so two test files sat unformatted without anything saying
      # so. gofmt exits 0 whether or not it found something and merely lists the
      # files it would rewrite, so the check is "did it name a file", not its
      # exit status.
      - name: Check formatting
        working-directory: src/web-viewer
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

  # ─── Linux (GCC) ────────────────────────────────────────────────────────────
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      - name: Install system dependencies
        run: .github/scripts/install-linux-deps.sh

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: ctest --preset linux-release

  # ─── Linux (Clang, ASan + UBSan) ────────────────────────────────────────────
  linux-sanitizers:
    name: Linux (Clang ASan+UBSan)
    runs-on: ubuntu-latest
    # 15, not the 8 this and linux-tsan had: they are the two jobs that run the
    # suite with MINILOG_STRESS_MULTIPLIER=10 under a sanitizer, and on the
    # 26.04 image they take 5 to 8.5 minutes where on 24.04 they took 5 to 6.5.
    # At 8 they timed out about half the time — and a timed-out job is reported
    # as `cancelled`, which reads like someone stopped it rather than a job
    # that needs longer. The number is headroom, not a measured requirement; a
    # real hang is caught by the suite's own per-test timeouts long before it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      - name: Install system dependencies
        run: .github/scripts/install-linux-deps.sh clang

      - name: Configure
        run: cmake --preset linux-asan

      - name: Build
        run: cmake --build --preset linux-asan

      - name: Test
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: ctest --preset linux-asan

  # ─── Linux (GCC, coverage) ──────────────────────────────────────────────────
  linux-coverage:
    name: Linux (Coverage)
    runs-on: ubuntu-latest
    # 12: it ran 6.0 of its old 8 on the 26.04 image, and it does the most of
    # any Linux job — the suite, then the Go tests again for their coverage,
    # then the browser tests for the JavaScript.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      - name: Install system dependencies
        run: .github/scripts/install-linux-deps.sh lcov

      - name: Configure
        run: cmake --preset linux-coverage

      - name: Build
        run: cmake --build --preset linux-coverage

      - name: Test
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: ctest --preset linux-coverage

      - name: Generate coverage report
        run: |
          # `inconsistent` alongside `mismatch` since ubuntu-latest moved to
          # 26.04 and gcov 15: it reports a mismatched end line for a function
          # (a Boost.Test case macro, as it happens) and lcov makes that an
          # error, which failed the capture on a tracefile that was otherwise
          # complete and a test run where all thirteen tests passed.
          lcov --capture --directory build/linux-coverage --output-file coverage.info \
            --ignore-errors mismatch,inconsistent
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info \
            --ignore-errors inconsistent
          # Not lcov --list or --summary: lcov 2.x prints nonsense rates from a
          # correct tracefile. Read LF/LH instead.
          awk -F: -v root="$PWD/" '
            /^SF:/ { f = substr($0, 4); sub("^" root, "", f) }
            /^LF:/ { lf = $2 }
            /^LH:/ { lh = $2 }
            /^end_of_record/ {
              printf "%-45s %6.1f%%  %5d/%d\n", f, lf ? 100 * lh / lf : 0, lh, lf
              tlf += lf; tlh += lh
            }
            END { printf "%-45s %6.1f%%  %5d/%d\n", "Total", tlf ? 100 * tlh / tlf : 0, tlh, tlf }
          ' coverage.info

      # The browser tests also record the coverage of the page's JavaScript,
      # which Go's coverage cannot see. Writing it fails the step if no browser
      # test ran, as it would here without Chrome.
      - name: Generate web-viewer coverage report
        run: |
          go test -coverprofile=web-viewer-coverage.out -covermode=atomic ./...
        working-directory: src/web-viewer
        env:
          MINILOG_JS_COVERAGE: web-ui-coverage.info

      - name: Upload server coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.info
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload web-viewer coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: src/web-viewer/web-viewer-coverage.out
          flags: web-viewer
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload web UI coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: src/web-viewer/web-ui-coverage.info
          flags: web-ui
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Linux (Clang, TSan) ────────────────────────────────────────────────────
  linux-tsan:
    name: Linux (Clang TSan)
    runs-on: ubuntu-latest
    # 15 for the reason given on linux-sanitizers above.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      - name: Install system dependencies
        run: .github/scripts/install-linux-deps.sh clang

      - name: Configure
        run: cmake --preset linux-tsan

      - name: Build
        run: cmake --build --preset linux-tsan

      - name: Test
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: ctest --preset linux-tsan

  # ─── Windows (MSVC) ─────────────────────────────────────────────────────────
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    # 25: it ran 13.9 of its old 20, and it is the one job whose timing out
    # also means no installer and no zip on a release tag.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      - name: Install Conan
        run: pip install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.conan2/p
            ~/.conan2/cache.sqlite3
          key: conan-windows-relwithdebinfo-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-windows-relwithdebinfo-

      - name: Install Ninja
        run: choco install ninja --no-progress

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Conan install
        run: |
          conan install . `
            --output-folder=build/windows-release `
            --build=missing `
            --settings=build_type=RelWithDebInfo `
            --settings=compiler.runtime=static `
            -c tools.cmake.cmaketoolchain:generator=Ninja

      # cl, link, the SDK, INCLUDE and LIB, which Ninja needs and the runner
      # does not provide. The script is this repository's own, so that no
      # third-party code runs in the job that builds and publishes the release.
      - name: Set up MSVC environment
        shell: pwsh
        run: .github/scripts/msvc-env.ps1

      - name: Check the MSVC environment
        shell: pwsh
        run: |
          Get-Command cl, link, rc | Format-Table Name, Source -AutoSize
          $env:Path -split ';' | Select-Object -First 8
          if (-not $env:INCLUDE -or -not $env:LIB) { throw 'INCLUDE or LIB is not set' }

      # A tag v1.4.0-beta2 names the packages minilog-1.4.0-beta2-*; a tag
      # v1.4.0 and an untagged build name them minilog-1.4.0-*. The numeric part
      # of the tag has to be the version in CMakeLists.txt, or the release would
      # carry files whose names and contents disagree about what version it is.
      - name: Derive the package version from the tag
        id: version
        shell: bash
        run: |
          project=$(sed -nE 's/^project\(minilog VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          suffix=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$project" && "$tag" != "$project"-* ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match project version $project in CMakeLists.txt"
              exit 1
            fi
            suffix="${tag#"$project"}"
          fi
          echo "package version: $project$suffix"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake --preset windows-release "-DMINILOG_VERSION_SUFFIX=${{ steps.version.outputs.suffix }}"

      - name: Build
        run: cmake --build --preset windows-release

      - name: Build installer
        run: cmake --build --preset windows-release --target package

      - name: Build zip archive
        run: cmake --build --preset windows-release --target package-zip

      - name: Test
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: ctest --preset windows-release

      - name: Test installer
        shell: pwsh
        run: |
          $exe = Get-Item "build/windows-release/minilog-*-setup.exe" | Select-Object -First 1
          python tests/installer/test_installer.py $exe.FullName

      # After the installer test, which leaves both services unregistered: the
      # two register the same service names.
      - name: Test zip archive
        shell: pwsh
        run: |
          $zip = Get-Item "build/windows-release/minilog-*-win64.zip" | Select-Object -First 1
          python tests/installer/test_zip_install.py $zip.FullName

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: minilog-installer
          path: build/windows-release/minilog-*-setup.exe
          if-no-files-found: error

      - name: Upload zip archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: minilog-zip
          path: build/windows-release/minilog-*-win64.zip
          if-no-files-found: error

      - name: Publish installer and zip archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/windows-release/minilog-*-setup.exe
            build/windows-release/minilog-*-win64.zip
          prerelease: ${{ contains(github.ref, '-') }}

  # ─── Windows (MSVC, coverage) ───────────────────────────────────────────────
  # A job of its own rather than steps added to the one above, for two reasons:
  # that job publishes the release and deliberately runs no third-party code,
  # where this one needs OpenCppCoverage and the Codecov action; and that job is
  # the workflow's critical path at thirteen minutes, which an uninlined build
  # and a tracing profiler would roughly double.
  #
  # What it measures that the Linux coverage job cannot is every Windows-only
  # path: platform/service_win.cpp and os_log_win.cpp, the web viewer's
  # service_windows.go, os_log_windows.go and open_windows.go, and the
  # `#ifdef _WIN32` blocks of retry_in_use.hpp, log_file.cpp, compress.cpp,
  # udp_server.cpp, preflight.cpp and both main.cpp. On Linux those files are
  # absent from the report altogether and their `*_other.go` stubs read as 0%,
  # which says nothing about the code that actually ships to Windows users.
  windows-coverage:
    name: Windows (Coverage)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      # The Go coverage first: it needs none of the MSVC scaffolding below and
      # takes about two minutes, so it reports even if the C++ half fails.
      # MINILOG_JS_COVERAGE is deliberately not set — the browser tests drive
      # the same app.js through the same Chrome as on Linux, so a second
      # measurement of it would only restate the Linux one.
      # bash, not the pwsh a Windows runner defaults to. Under pwsh this exact
      # line reached go as -coverprofile=web-viewer-coverage plus a separate
      # `.out`, which it read as a package to test and failed on; quoting the
      # argument also fixes it, but bash makes the line identical to the Linux
      # coverage job's, which is the version that is known to work.
      # (Which token pwsh breaks on is not obvious — the windows job passes
      # --settings=compiler.runtime=static through unquoted without trouble —
      # so the rule is not worth encoding here, only the avoidance.)
      - name: Generate web-viewer coverage report
        shell: bash
        run: go test -coverprofile=web-viewer-coverage.out -covermode=atomic ./...
        working-directory: src/web-viewer

      - name: Upload web-viewer coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: src/web-viewer/web-viewer-coverage.out
          flags: web-viewer-windows
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install Conan
        run: pip install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      # The windows job's own key: the Conan settings below are that job's, so
      # the packages are the same and the two share one cache entry. Only the
      # compiler flags differ, and those are CMake's, not Conan's. Restore and
      # not cache, so that the two jobs do not both try to save the same key —
      # the windows job is the one that writes it.
      - name: Restore Conan packages
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.conan2/p
            ~/.conan2/cache.sqlite3
          key: conan-windows-relwithdebinfo-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-windows-relwithdebinfo-

      - name: Install Ninja
        run: choco install ninja --no-progress

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage --no-progress

      - name: Conan install
        run: |
          conan install . `
            --output-folder=build/windows-coverage `
            --build=missing `
            --settings=build_type=RelWithDebInfo `
            --settings=compiler.runtime=static `
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Set up MSVC environment
        shell: pwsh
        run: .github/scripts/msvc-env.ps1

      # RelWithDebInfo with /Od /Ob0 in place of /O2 /Ob1 (see the preset): the
      # PDBs OpenCppCoverage reads come from /Zi, and the inlining is what would
      # otherwise attribute a line to the function it was inlined into. The
      # equivalent on the Linux job is -fno-inline.
      - name: Configure
        run: cmake --preset windows-coverage

      - name: Build
        run: cmake --build --preset windows-coverage

      # The service tests below install from the zip, so it has to be built.
      # The Inno Setup installer is not, which is why this job does not install
      # Inno Setup: test_installer.py covers the same service commands through
      # a second path, and the zip test calls --install, --stop and --uninstall
      # on the executables directly.
      - name: Build zip archive
        run: cmake --build --preset windows-coverage --target package-zip

      # Two runs. The first exports OpenCppCoverage's own binary format; the
      # second reads that back with --input_coverage and exports the two
      # together, which merges them without a separate merge-only invocation.
      #
      # --cover_children because every test is a child process: the Boost.Test
      # executables, Python driving minilog, and Python driving the installed
      # service commands. --modules minilog restricts tracing to our own
      # binaries wherever they are loaded from (the build tree here, and
      # C:\minilog-zip-test\bin in the second run) so that python.exe, go.exe
      # and Chrome are not single-stepped. --sources src keeps the report to
      # this repository's code: Boost and SDK headers live under no path
      # containing "src", and our test sources are under tests/.
      #
      # test_web_viewer and test_cli_viewer are excluded by the test preset:
      # they exercise Go and Python, reach no C++ at all, and cost two minutes
      # of profiled runtime to prove it.
      - name: Test with coverage
        shell: pwsh
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: |
          $ErrorActionPreference = 'Stop'
          $occ = Join-Path $env:ProgramFiles 'OpenCppCoverage\OpenCppCoverage.exe'
          if (-not (Test-Path $occ)) { throw "OpenCppCoverage is not at $occ" }
          "OCC=$occ" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          & $occ --quiet --cover_children --modules minilog --sources src `
            --excluded_sources tests `
            --export_type "binary:ctest.cov" `
            -- ctest --preset windows-coverage
          if ($LASTEXITCODE -ne 0) { throw "ctest failed with exit code $LASTEXITCODE" }

      # What the Linux job has no way to reach: installService, uninstallService,
      # stopService, requestStop, stopAndWait and queryServiceState, all of
      # which run as an ordinary process that the test launches. The service
      # process the SCM starts is not a child of this one, so serviceMsgMain,
      # serviceCtrlHandler, reportStatus and tryRunAsService stay unmeasured —
      # see the Windows coverage section of AGENTS.md.
      - name: Test the service commands with coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-Item "build/windows-coverage/minilog-*-win64.zip" | Select-Object -First 1
          & $env:OCC --quiet --cover_children --modules minilog --sources src `
            --excluded_sources tests `
            "--input_coverage=ctest.cov" `
            --export_type "cobertura:windows-coverage.xml" `
            -- python tests/installer/test_zip_install.py $zip.FullName
          if ($LASTEXITCODE -ne 0) { throw "the zip install test failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'windows-coverage.xml')) { throw 'no coverage report was written' }

      # Rewrites the absolute build-machine paths OpenCppCoverage writes into
      # repo-relative ones, which is what lets Codecov line this report up with
      # the Linux one, and prints the per-file table into the log.
      - name: Summarise the coverage report
        shell: pwsh
        run: python .github/scripts/summarise_cobertura.py windows-coverage.xml

      - name: Upload server coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: windows-coverage.xml
          flags: server-windows
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Linux (Clang, libFuzzer) ────────────────────────────────────────────
  linux-fuzz:
    name: Linux (libFuzzer)
    runs-on: ubuntu-latest
    # 12: it ran 6.1 of its old 8 on the 26.04 image.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: .github/scripts/install-linux-deps.sh clang

      - name: Configure
        run: cmake --preset linux-fuzz

      - name: Build
        run: cmake --build --preset linux-fuzz --target fuzz_parser

      - name: Fuzz (30 s)
        run: |
          ./build/linux-fuzz/bin/fuzz_parser \
            -max_total_time=30 \
            -jobs=2 \
            tests/server/fuzz/corpus/

  # ─── Docker ──────────────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build .
