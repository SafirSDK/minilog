name: Build & Test

# Third-party actions are pinned to a full commit SHA with the version in a
# trailing comment. A tag is a mutable pointer, so "@v2" means the code that
# runs here can change without any change in this file — and these jobs hold
# GITHUB_TOKEN (the release upload) and CODECOV_TOKEN (the coverage upload).
# actions/* are GitHub's own and are left on tags.
#
# To move one: read the new SHA with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'
# and dereference it with git/tags/<sha> if that returns an annotated tag
# object rather than a commit.

on:
  push:
    branches: [ master, develop, feature/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # ─── clang-format check ─────────────────────────────────────────────────────
  clang-format:
    name: clang-format check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find src/server src/send tests/server tests/send -name "*.cpp" -o -name "*.hpp" \
            | xargs clang-format --dry-run --Werror

  # ─── File header check ───────────────────────────────────────────────────────
  check-headers:
    name: File header check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - run: python3 tests/check_headers.py

  # ─── Python linting (ruff) ──────────────────────────────────────────────────
  ruff:
    name: Ruff (Python linting)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ruff
      - run: ruff check .

  # ─── Go formatting (gofmt) ──────────────────────────────────────────────────
  gofmt:
    name: gofmt check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      # The C++ side has had a clang-format gate from the start and the Go side
      # had nothing, so two test files sat unformatted without anything saying
      # so. gofmt exits 0 whether or not it found something and merely lists the
      # files it would rewrite, so the check is "did it name a file", not its
      # exit status.
      - name: Check formatting
        working-directory: src/web-viewer
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

  # ─── Linux (GCC) ────────────────────────────────────────────────────────────
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libboost-all-dev

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: ctest --preset linux-release

  # ─── Linux (Clang, ASan + UBSan) ────────────────────────────────────────────
  linux-sanitizers:
    name: Linux (Clang ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build clang libboost-all-dev

      - name: Configure
        run: cmake --preset linux-asan

      - name: Build
        run: cmake --build --preset linux-asan

      - name: Test
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: ctest --preset linux-asan

  # ─── Linux (GCC, coverage) ──────────────────────────────────────────────────
  linux-coverage:
    name: Linux (Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libboost-all-dev lcov

      - name: Configure
        run: cmake --preset linux-coverage

      - name: Build
        run: cmake --build --preset linux-coverage

      - name: Test
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: ctest --preset linux-coverage

      - name: Generate coverage report
        run: |
          lcov --capture --directory build/linux-coverage --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Generate web-viewer coverage report
        run: |
          go test -coverprofile=web-viewer-coverage.out -covermode=atomic ./...
        working-directory: src/web-viewer

      - name: Upload server coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.info
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload web-viewer coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: src/web-viewer/web-viewer-coverage.out
          flags: web-viewer
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Linux (Clang, TSan) ────────────────────────────────────────────────────
  linux-tsan:
    name: Linux (Clang TSan)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build clang libboost-all-dev

      - name: Configure
        run: cmake --preset linux-tsan

      - name: Build
        run: cmake --build --preset linux-tsan

      - name: Test
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: ctest --preset linux-tsan

  # ─── Windows (MSVC) ─────────────────────────────────────────────────────────
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/web-viewer/go.mod
          cache: false

      - name: Install Conan
        run: pip install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.conan2/p
            ~/.conan2/cache.sqlite3
          key: conan-windows-relwithdebinfo-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-windows-relwithdebinfo-

      - name: Install Ninja
        run: choco install ninja --no-progress

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Conan install
        run: |
          conan install . `
            --output-folder=build/windows-release `
            --build=missing `
            --settings=build_type=RelWithDebInfo `
            --settings=compiler.runtime=static `
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # A tag v1.4.0-beta2 names the packages minilog-1.4.0-beta2-*; a tag
      # v1.4.0 and an untagged build name them minilog-1.4.0-*. The numeric part
      # of the tag has to be the version in CMakeLists.txt, or the release would
      # carry files whose names and contents disagree about what version it is.
      - name: Derive the package version from the tag
        id: version
        shell: bash
        run: |
          project=$(sed -nE 's/^project\(minilog VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          suffix=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$project" && "$tag" != "$project"-* ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match project version $project in CMakeLists.txt"
              exit 1
            fi
            suffix="${tag#"$project"}"
          fi
          echo "package version: $project$suffix"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake --preset windows-release "-DMINILOG_VERSION_SUFFIX=${{ steps.version.outputs.suffix }}"

      - name: Build
        run: cmake --build --preset windows-release

      - name: Build installer
        run: cmake --build --preset windows-release --target package

      - name: Build zip archive
        run: cmake --build --preset windows-release --target package-zip

      - name: Test
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: ctest --preset windows-release

      - name: Test installer
        shell: pwsh
        run: |
          $exe = Get-Item "build/windows-release/minilog-*-setup.exe" | Select-Object -First 1
          python tests/installer/test_installer.py $exe.FullName

      # After the installer test, which leaves both services unregistered: the
      # two register the same service names.
      - name: Test zip archive
        shell: pwsh
        run: |
          $zip = Get-Item "build/windows-release/minilog-*-win64.zip" | Select-Object -First 1
          python tests/installer/test_zip_install.py $zip.FullName

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: minilog-installer
          path: build/windows-release/minilog-*-setup.exe
          if-no-files-found: error

      - name: Upload zip archive artifact
        uses: actions/upload-artifact@v6
        with:
          name: minilog-zip
          path: build/windows-release/minilog-*-win64.zip
          if-no-files-found: error

      - name: Publish installer and zip archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            build/windows-release/minilog-*-setup.exe
            build/windows-release/minilog-*-win64.zip
          prerelease: ${{ contains(github.ref, '-') }}

  # ─── Linux (Clang, libFuzzer) ────────────────────────────────────────────
  linux-fuzz:
    name: Linux (libFuzzer)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build clang libboost-all-dev

      - name: Configure
        run: cmake --preset linux-fuzz

      - name: Build
        run: cmake --build --preset linux-fuzz --target fuzz_parser

      - name: Fuzz (30 s)
        run: |
          ./build/linux-fuzz/bin/fuzz_parser \
            -max_total_time=30 \
            -jobs=2 \
            tests/server/fuzz/corpus/

  # ─── Docker ──────────────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build .
